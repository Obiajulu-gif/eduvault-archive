openapi: "3.1.0"

info:
  title: EduVault API
  version: "1.0.0"
  description: |
    REST API for the EduVault decentralised learning-material marketplace.
    All write endpoints require a valid `auth_token` cookie issued by the
    `/api/auth` login flow (HS256 JWT signed with `JWT_SECRET`).

servers:
  - url: "http://localhost:3000"
    description: Local development
  - url: "https://eduvault.vercel.app"
    description: Production (Vercel)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
      required: [error]

    Material:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
        userAddress:
          type: string
          description: Stellar public key of the uploader
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [title, price]

    MaterialInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: float
          minimum: 0
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
      required: [title, price]

    MaterialImportRecord:
      type: object
      required: [title, storageKey]
      properties:
        externalId:
          type: string
          maxLength: 128
          description: Stable id from the source system. Re-importing a row with the same externalId updates or skips instead of duplicating.
        title:
          type: string
        storageKey:
          type: string
        description:
          type: string
        shortSummary:
          type: string
        price:
          type: number
        visibility:
          type: string
          enum: [private, public, unlisted]
        category:
          type: string
        subject:
          type: string
        level:
          type: string
        usageRights:
          type: string
        coverImageUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        learningOutcomes:
          type: array
          items:
            type: string
        tableOfContents:
          type: array
          items:
            type: string
        sampleNotes:
          type: array
          items:
            type: string

    ImportRowError:
      type: object
      required: [row, errors]
      properties:
        row:
          type: integer
          description: 1-based position in the submitted records array
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        conflict:
          $ref: "#/components/schemas/ImportConflict"

    ImportConflict:
      type: object
      required: [type, field]
      properties:
        type:
          type: string
          enum: [duplicate_in_batch, existing_storage_key]
        field:
          type: string
          enum: [externalId, storageKey]
        firstRow:
          type: integer

    ImportPlanRow:
      type: object
      required: [row, action]
      properties:
        row:
          type: integer
        action:
          type: string
          enum: [create, update, skip, error]
        externalId:
          type: [string, "null"]
        materialId:
          type: string
        fields:
          type: array
          description: Fields an update would change
          items:
            type: string
        reason:
          type: string
        errors:
          type: array
          items:
            type: object

    MaterialImportResponse:
      type: object
      required: [dryRun, total, valid, invalid, invalidRows, summary, rows]
      properties:
        dryRun:
          type: boolean
        total:
          type: integer
        valid:
          type: integer
        invalid:
          type: integer
        invalidRows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
        summary:
          type: object
          required: [create, update, skip, duplicate, error]
          properties:
            create:
              type: integer
            update:
              type: integer
            skip:
              type: integer
            duplicate:
              type: integer
            error:
              type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportPlanRow"
        message:
          type: string

    MaterialImportCommitResponse:
      allOf:
        - $ref: "#/components/schemas/MaterialImportResponse"
        - type: object
          required: [importBatchId, imported, created, updated, failedRows, rollback]
          properties:
            importBatchId:
              type: string
            imported:
              type: integer
              description: created + updated
            created:
              type: integer
            updated:
              type: integer
            failedRows:
              type: array
              items:
                type: object
                required: [row, action, message]
                properties:
                  row:
                    type: integer
                  action:
                    type: string
                    enum: [create, update]
                  code:
                    type: integer
                  message:
                    type: string
            rollback:
              type: object
              required: [importBatchId, created, updated, retry]
              properties:
                importBatchId:
                  type: string
                created:
                  type: string
                updated:
                  type: string
                retry:
                  type: string

    Notification:
      type: object
      required: [id, type, severity, title, message, link, read, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [import_completed, import_partial_failure]
        severity:
          type: string
          enum: [success, error]
        title:
          type: string
        message:
          type: string
        link:
          type: [string, "null"]
          description: Internal app path to the related workflow
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount:
          type: integer

    UserProfile:
      type: object
      properties:
        _id:
          type: string
        walletAddress:
          type: string
        displayName:
          type: string
        bio:
          type: string
        institution:
          type: string
        country:
          type: string
        payoutWalletAddress:
          type: string
        preferredPayoutCurrency:
          type: string
        payoutNotes:
          type: string
        createdAt:
          type: string
          format: date-time

    Purchase:
      type: object
      properties:
        _id:
          type: string
        buyerAddress:
          type: string
        materialId:
          type: string
        userEmail:
          type: string
        status:
          type: string
          enum: [pending, confirmed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Entitlement:
      type: object
      properties:
        materialId:
          type: string
        grantedAt:
          type: string
          format: date-time

IncidentInput:
      type: object
      description: Inputs for the incident impact calculator.
      required: [incidentId, window]
      properties:
        incidentId:
          type: string
          description: Stable identifier for the incident being assessed.
        window:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        affectedUsers:
          type: array
          description: Wallet addresses of users believed to be affected.
          items:
            type: string
        affectedRecords:
          type: array
          description: Material ids believed to be affected.
          items:
            type: string
        affectedOperations:
          type: array
          description: Operation types that were disrupted.
          items:
            type: string
            enum: [purchase, import, download, entitlement]
        severity:
          type: string
          enum: [low, medium, high, critical]
        redact:
          type: boolean
          default: true
          description: When true, return the shareable view with sensitive details redacted.

    IncidentImpactSummary:
      type: object
      required: [users, records, operations, severity]
      properties:
        users:
          type: integer
        records:
          type: integer
        operations:
          type: integer
        severity:
          type: string
          enum: [low, medium, high, critical]

    IncidentImpactResult:
      type: object
      required: [incidentId, window, summary, internal, shareable]
      properties:
        incidentId:
          type: string
        window:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        summary:
          $ref: "#/components/schemas/IncidentImpactSummary"
        internal:
          type: object
          description: Full detail for maintainers. Only included when redact is false.
          properties:
            affectedUsers:
              type: array
              items:
                type: string
            affectedRecords:
              type: array
              items:
                type: string
            affectedOperations:
              type: array
              items:
                type: string
        shareable:
          type: object
          description: Redacted view safe for external communication.
          required: [incidentId, window, summary]
          properties:
            incidentId:
              type: string
            window:
              type: object
              required: [start, end]
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
            summary:
              $ref: "#/components/schemas/IncidentImpactSummary"
            note:
              type: string
              description: Human-readable explanation of the redaction.

    ReceiptPayload:
      type: object
      description: |
        Canonical, deterministic receipt payload. The `SIGNATURE_VERSION` and
        `SIGNATURE_ALGORITHM` are constants so consumers can recreate the
        canonical bytes and verify the HMAC-SHA256 signature independently.
      required:
        - receiptId
        - operation
        - actor
        - timestamp
        - status
        - references
        - signatureVersion
        - signatureAlgorithm
        - signature
      properties:
        receiptId:
          type: string
          description: Stable identifier derived from the canonical payload hash
        operation:
          type: string
          enum:
            - material.create
            - material.import
            - purchase.create
            - entitlement.grant
            - profile.update
        actor:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [user, system]
            id:
              type: string
              description: User ObjectId or wallet address
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp of when the operation completed
        status:
          type: string
          enum: [success, failure, denied]
        references:
          type: object
          description: External references to the affected resources
          additionalProperties:
            type: string
        signatureVersion:
          type: string
          enum: [v1]
        signatureAlgorithm:
          type: string
          enum: [HMAC-SHA256]
        signature:
          type: string
          description: Hex-encoded HMAC-SHA256 over the canonical payload bytes

    Receipt:
      allOf:
        - $ref: "#/components/schemas/ReceiptPayload"
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              type: string
              format: date-time
              description: When the receipt record was persisted

    ReceiptList:
      type: object
      required: [receipts, total]
      properties:
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/Receipt"
        total:
          type: integer

    ReceiptVerification:
      type: object
      required: [receiptId, valid]
      properties:
        receiptId:
          type: string
        valid:
          type: boolean
        reason:
          type: string
          description: Present when valid is false
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Toot many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - cookieAuth: []

paths:
  # --------------------------------------------------------------------------
  # Materials
  # --------------------------------------------------------------------------
  /api/materials:
    get:
      summary: List the authenticated user's materials
      operationId: listMyMaterials
      tags: [Materials]
      responses:
        "200":
          description: Array of material documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
"401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create a new material listing
      operationId: createMaterial
      tags: [Materials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Material created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/materials/import:
    post:
      summary: Validate or import structured material records
      operationId: importMaterials
      tags: [Materials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [json, csv]
                dryRun:
                  type: boolean
                records:
                  type: array
                  items:
                    $ref: "#/components/schemas/MaterialImportRecord"
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/MaterialImportRecord"
      responses:
        "200":
          description: Dry-run plan with no errors, or a commit where every row was already imported. Dry runs never write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialImportResponse"
        "201":
          description: Every planned create/update was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialImportCommitResponse"
        "207":
          description: Partial import — some writes failed; see failedRows and rollback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialImportCommitResponse"
        "400":
          description: Invalid or duplicate rows (plan included, nothing written), or a malformed payload
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MaterialImportResponse"
                  - $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/incidents/impact:
    post:
      summary: Calculate incident impact across users, records, operations, and time windows
      operationId: calculateIncidentImpact
      tags: [Incidents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "200":
          description: Deterministic impact report with internal and shareable fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentImpactResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
