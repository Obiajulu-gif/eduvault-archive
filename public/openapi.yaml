openapi: "3.1.0"

info:
  title: EduVault API
  version: "1.0.0"
  description: |
    REST API for the EduVault decentralised learning-material marketplace.
    All write endpoints require a valid `auth_token` cookie issued by the
    `/api/auth` login flow (HS256 JWT signed with `JWT_SECRET`).

servers:
  - url: "http://localhost:3000"
    description: Local development
  - url: "https://eduvault.vercel.app"
    description: Production (Vercel)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token

  schemas:
    Error:
      description: Problem Details response schema (legacy name retained for references).
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"

    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, code, retryable, recovery, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe occurrence summary or remediation guidance. Never includes internal exception details.
        instance:
          type: string
          description: Request path without query parameters.
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - VALIDATION_FIELD
            - VALIDATION_FILE_TYPE
            - VALIDATION_FILE_SIZE
            - VALIDATION_UPLOAD_TOO_LARGE
            - VALIDATION_RANGE_TOO_LARGE
            - AUTH_UNAUTHENTICATED
            - AUTH_SESSION_EXPIRED
            - AUTH_FORBIDDEN
            - AUTH_SUSPENDED
            - ENTITLEMENT_REQUIRED
            - ENTITLEMENT_PURCHASE_REQUIRED
            - ENTITLEMENT_UNAVAILABLE
            - MATERIAL_ARCHIVED
            - NOT_FOUND
            - CONFLICT_DUPLICATE
            - CONFLICT_IDEMPOTENCY_KEY
            - CONFLICT_STATE
            - SETTLEMENT_QUOTE_EXPIRED
            - SETTLEMENT_INSUFFICIENT_FUNDS
            - SETTLEMENT_TX_FAILED
            - SETTLEMENT_TIMEOUT
            - SETTLEMENT_UNAVAILABLE
            - PAYOUT_PROFILE_INCOMPLETE
            - PAYOUT_UNAVAILABLE
            - STORAGE_UPLOAD_FAILED
            - STORAGE_NOT_FOUND
            - STORAGE_UNAVAILABLE
            - STORAGE_QUARANTINED
            - RATE_LIMITED
            - INTERNAL
        retryable:
          type: boolean
        recovery:
          type: string
        correlationId:
          type: string
        error:
          type: string
          deprecated: true
          description: Compatibility alias for older clients; migrate to code and detail.
        retryAfter:
          type: integer
          minimum: 0
          description: Present on rate-limit responses.

    Material:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
        userAddress:
          type: string
          description: Stellar public key of the uploader
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [title, price]

    MaterialInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: float
          minimum: 0
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        fileUrl:
          type: string
          format: uri
      required: [title, price]

    UserProfile:
      type: object
      properties:
        _id:
          type: string
        walletAddress:
          type: string
        displayName:
          type: string
        bio:
          type: string
        createdAt:
          type: string
          format: date-time

    Purchase:
      type: object
      properties:
        _id:
          type: string
        buyerAddress:
          type: string
        materialId:
          type: string
        amount:
          type: number
        txHash:
          type: string
          description: Stellar / Soroban transaction hash
        status:
          type: string
          enum: [pending, confirmed, failed]
        createdAt:
          type: string
          format: date-time

    Entitlement:
      type: object
      properties:
        materialId:
          type: string
        grantedAt:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimited:
      description: Too many requests
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Problem:
      description: RFC 9457 Problem Details error with a stable EduVault code
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

security:
  - cookieAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Materials
  # ---------------------------------------------------------------------------
  /api/materials:
    get:
      summary: List the authenticated user's materials
      operationId: listMyMaterials
      tags: [Materials]
      responses:
        "200":
          description: Array of material documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
        "401":
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    post:
      summary: Create a new material listing
      operationId: createMaterial
      tags: [Materials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Material created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------------------
  # Market materials (public browse)
  # ---------------------------------------------------------------------------
  /api/market-materials:
    get:
      summary: Browse publicly listed materials
      operationId: browseMarketMaterials
      tags: [Market]
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          description: Pagination cursor (MongoDB ObjectId of the last seen item)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated list of materials
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Material"
                  nextCursor:
                    type: string
                    nullable: true

  # ---------------------------------------------------------------------------
  # Upload
  # ---------------------------------------------------------------------------
  /api/upload:
    post:
      summary: Upload a material file to Pinata / IPFS
      operationId: uploadMaterialFile
      tags: [Upload]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Upload successful — returns the IPFS / gateway URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  cid:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Purchase
  # ---------------------------------------------------------------------------
  /api/purchase:
    post:
      summary: Record a material purchase after on-chain payment
      operationId: recordPurchase
      tags: [Purchase]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                materialId:
                  type: string
                txHash:
                  type: string
                amount:
                  type: number
              required: [materialId, txHash, amount]
      responses:
        "201":
          description: Purchase recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /api/transactions/history:
    get:
      summary: Aggregate account purchase and Stellar transaction history
      operationId: listTransactionHistory
      tags: [Purchase]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated merged history from MongoDB and Horizon
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  limit:
                    type: integer
                  hasMore:
                    type: boolean
                  totals:
                    type: object
                    properties:
                      purchases:
                        type: integer
                  records:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Entitlements
  # ---------------------------------------------------------------------------
  /api/entitlements:
    get:
      summary: Verify access for a buyer and material pair
      operationId: verifyEntitlement
      tags: [Entitlements]
      security: []
      parameters:
        - name: buyerAddress
          in: query
          required: true
          schema:
            type: string
        - name: materialId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entitlement decision
          content:
            application/json:
              schema:
                type: object
                required: [hasAccess, source]
                properties:
                  hasAccess:
                    type: boolean
                  source:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Problem"

  /api/download:
    get:
      summary: Issue a short-lived capability for entitled material
      operationId: issueDownloadCapability
      tags: [Entitlements]
      parameters:
        - name: materialId
          in: query
          required: true
          schema:
            type: string
        - name: buyerAddress
          in: query
          schema:
            type: string
        - name: range
          in: query
          schema:
            type: string
            example: "0-1023"
      responses:
        "200":
          description: Capability URL and non-secret capability metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, materialId, fileUrl, capability]
                properties:
                  ok:
                    type: boolean
                  materialId:
                    type: string
                  fileUrl:
                    type: string
                    format: uri
                  capability:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /api/creator/payouts:
    get:
      summary: Read creator earnings and payout summary
      operationId: getCreatorPayoutSummary
      tags: [Creator]
      responses:
        "200":
          description: Creator earnings and payout summary
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Problem"

  /api/creator/materials/{id}/archive:
    post:
      summary: Archive or restore a creator-owned material
      operationId: updateMaterialArchiveState
      tags: [Creator]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                archived:
                  type: boolean
                action:
                  type: string
                  enum: [archive, restore]
      responses:
        "200":
          description: Updated archive state
          content:
            application/json:
              schema:
                type: object
                required: [success, materialId, archived, archivedAt]
                properties:
                  success:
                    type: boolean
                  materialId:
                    type: string
                  archived:
                    type: boolean
                  archivedAt:
                    type: [string, "null"]
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # User profile
  # ---------------------------------------------------------------------------
  /api/profile:
    get:
      summary: Get the authenticated user's profile
      operationId: getProfile
      tags: [Profile]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      summary: Update the authenticated user's profile
      operationId: updateProfile
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 80
                bio:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
